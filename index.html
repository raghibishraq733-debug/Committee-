<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMITTEE // Sector 09</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       MINI-GAME 1: HARDCORE ALL-9 RUI MACH SLAP & CATCH
       ========================================================================== */
    function initRuiMachGame() {
      const arena = document.getElementById("fish-arena");
      const scoreEl = document.getElementById("fish-score");
      const comboEl = document.getElementById("fish-combo");
      const timeEl = document.getElementById("fish-time");
      const bestEl = document.getElementById("fish-best");
      const comboBar = document.getElementById("fish-combo-bar");
      const windBanner = document.getElementById("fish-wind-banner");
      const castStrip = document.getElementById("arena-cast-strip");
      const startBtn = document.getElementById("btn-start-fish");

      // Render all 9 members along the bottom of the arena as active cast
      castStrip.innerHTML = "";
      COMMITTEE_CONFIG.members.forEach((m) => {
        const slot = document.createElement("div");
        slot.className = "arena-mini-actor";
        slot.id = `arena-cast-${m.id}`;
        slot.appendChild(createAvatarVisual(m));
        const lbl = document.createElement("div");
        lbl.className = "arena-mini-label";
        lbl.textContent = m.name;
        slot.appendChild(lbl);
        castStrip.appendChild(slot);
      });

      let score = 0;
      let combo = 1;
      let comboDecay = 0; // 0..100 (100 = full combo bar, decays over time)
      let best = parseInt(localStorage.getItem("committee_ruimach_best") || "0", 10);
      bestEl.textContent = best;

      let timeLeft = 30;
      let running = false;
      let windForceX = 0;
      let spawnTimer = null;
      let countdownTimer = null;
      let windTimer = null;
      let decayTimer = null;

      function highlightMemberInArena(memberId, shoutText) {
        document.querySelectorAll(".arena-mini-actor.is-active-caller").forEach((el) => {
          el.classList.remove("is-active-caller");
        });
        const slot = document.getElementById(`arena-cast-${memberId}`);
        if (slot) {
          slot.classList.add("is-active-caller");
          setTimeout(() => slot.classList.remove("is-active-caller"), 900);
        }
        if (shoutText) {
          windBanner.textContent = `${memberId.toUpperCase()}: ${shoutText}`;
        }
      }

      function spawnPopText(x, y, text, color) {
        const pop = document.createElement("div");
        pop.className = "floating-score-pop";
        pop.style.left = `${x}px`;
        pop.style.top = `${y}px`;
        pop.style.color = color;
        pop.textContent = text;
        arena.appendChild(pop);
        setTimeout(() => pop.remove(), 660);
      }

      function spawnTarget() {
        if (!running) return;
        const roll = Math.random();
        let kind = "rui";
        if (roll > 0.86) kind = "gold";
        else if (roll > 0.68) kind = "decoy";
        else if (roll > 0.48) kind = "barrel";
        else if (roll > 0.30) kind = "scowl";

        const el = document.createElement("div");
        el.className = "flying-target";

        if (kind === "rui") {
          el.innerHTML = `<svg width="64" height="34" viewBox="0 0 68 36"><path d="M6 18 Q24 2 50 14 L64 6 L60 18 L64 30 L50 22 Q24 34 6 18 Z" fill="#8fa199" stroke="#090a08" stroke-width="2.5"/><circle cx="17" cy="15" r="2.5" fill="#090a08"/></svg>`;
        } else if (kind === "gold") {
          el.innerHTML = `<svg width="66" height="36" viewBox="0 0 68 36"><path d="M6 18 Q24 2 50 14 L64 6 L60 18 L64 30 L50 22 Q24 34 6 18 Z" fill="#d4a437" stroke="#090a08" stroke-width="2.5"/><circle cx="17" cy="15" r="2.5" fill="#090a08"/></svg>`;
        } else if (kind === "decoy") {
          // Slippery fake decoy fish (looks like Rui, costs points & combo!)
          el.innerHTML = `<svg width="62" height="32" viewBox="0 0 68 36"><path d="M6 18 Q24 2 50 14 L64 6 L60 18 L64 30 L50 22 Q24 34 6 18 Z" fill="#6b7566" stroke="#e46639" stroke-width="2.5" stroke-dasharray="4 2"/><text x="22" y="21" font-size="11" fill="#090a08" font-weight="bold">FAKE</text></svg>`;
        } else if (kind === "barrel") {
          el.innerHTML = `<svg width="46" height="56" viewBox="0 0 46 56"><rect x="5" y="4" width="36" height="48" rx="5" fill="#4b573c" stroke="#090a08" stroke-width="2.5"/><line x1="5" y1="18" x2="41" y2="18" stroke="#1b2217" stroke-width="3"/><line x1="5" y1="38" x2="41" y2="38" stroke="#1b2217" stroke-width="3"/></svg>`;
        } else {
          el.innerHTML = `<svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#b82929" stroke="#090a08" stroke-width="2.5"/><path d="M14 17 L21 20 M34 17 L27 20 M16 32 L24 28 L32 32" stroke="#090a08" stroke-width="3" fill="none"/></svg>`;
        }

        const fromLeft = Math.random() > 0.5;
        let x = fromLeft ? -35 : arena.clientWidth + 35;
        let y = 60 + Math.random() * (arena.clientHeight - 180);
        let vx = (fromLeft ? 1 : -1) * (4.4 + Math.random() * 4.2);
        let vy = -4.2 - Math.random() * 3.2;
        const phase = Math.random() * Math.PI * 2;
        let age = 0;
        const gravity = 0.14;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        arena.appendChild(el);

        let hit = false;
        const onHit = (e) => {
          e.stopPropagation();
          if (!running || hit) return;
          hit = true;
          el.remove();

          if (kind === "rui" || kind === "gold") {
            const pts = (kind === "gold" ? 35 : 15) * combo;
            score += pts;
            combo = Math.min(10, combo + 1);
            comboDecay = 100;
            audioManager.playSynthSignature("marketChirp");
            const callers = ["sayzid", "ragib", "jahid", "anam"];
            const picked = callers[Math.floor(Math.random() * callers.length)];
            const mObj = COMMITTEE_CONFIG.members.find((m) => m.id === picked);
            highlightMemberInArena(picked, mObj ? mObj.dialogue : "RUI MACH!");
            spawnPopText(x, y, `+${pts}`, "#d4a437");
          } else if (kind === "decoy") {
            score = Math.max(0, score - 20);
            combo = 1;
            comboDecay = 0;
            audioManager.playSynthSignature("shadySlide");
            highlightMemberInArena("ali", "dalali slip! Fake Rui!");
            spawnPopText(x, y, "-20 FAKE!", "#e46639");
          } else if (kind === "barrel") {
            score = Math.max(0, score - 25);
            combo = 1;
            comboDecay = 0;
            audioManager.playSynthSignature("barrelBass");
            highlightMemberInArena("bipu", "barrel homu! (-25)");
            spawnPopText(x, y, "-25 BARREL!", "#e46639");
          } else {
            score = Math.max(0, score - 30);
            combo = 1;
            comboDecay = 0;
            audioManager.playSynthSignature("grumpGrowl");
            highlightMemberInArena("billal", "kire shuworer bacchara! (-30)");
            spawnPopText(x, y, "-30 BILLAL!", "#b82929");
          }

          scoreEl.textContent = score;
          comboEl.textContent = `x${combo}`;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem("committee_ruimach_best", String(best));
          }
        };

        el.addEventListener("pointerdown", onHit);

        const step = () => {
          if (hit || !running) {
            el.remove();
            return;
          }
          age += 1;
          // Erratic zig-zag + wind gust + shrinking scale over lifetime
          const zig = Math.sin(age * 0.22 + phase) * 3.4;
          x += vx + windForceX;
          y += vy + zig * 0.35;
          vy += gravity;

          const shrink = Math.max(0.55, 1.05 - age * 0.0045);
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.transform = `translate(-50%, -50%) scale(${shrink.toFixed(2)})`;

          if (y > arena.clientHeight - 40 || x < -90 || x > arena.clientWidth + 90) {
            el.remove();
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      function cycleWindGust() {
        if (!running) return;
        const gusts = [
          { force: -2.4, cls: "wind-gust-left", label: "WIND GUST LEFT // VASTE & NAFI WATCHING", member: "nafi" },
          { force: 2.5, cls: "wind-gust-right", label: "WIND GUST RIGHT // RAGIB & ANAM WATCHING", member: "anam" },
          { force: 0, cls: "", label: "CALM AIR // ALL 9 OPERATIVES ACTIVE", member: "vaste" }
        ];
        const g = gusts[Math.floor(Math.random() * gusts.length)];
        windForceX = g.force;
        arena.classList.remove("wind-gust-left", "wind-gust-right");
        if (g.cls) arena.classList.add(g.cls);
        highlightMemberInArena(g.member, g.label);
      }

      startBtn.addEventListener("click", () => {
        clearInterval(spawnTimer);
        clearInterval(countdownTimer);
        clearInterval(windTimer);
        clearInterval(decayTimer);
        arena.querySelectorAll(".flying-target").forEach((n) => n.remove());

        score = 0;
        combo = 1;
        comboDecay = 0;
        timeLeft = 30;
        windForceX = 0;
        running = true;

        scoreEl.textContent = "0";
        comboEl.textContent = "x1";
        timeEl.textContent = "30s";
        comboBar.style.width = "0%";
        startBtn.textContent = "Restart Hardcore Rush";

        const sayzid = COMMITTEE_CONFIG.members.find((m) => m.id === "sayzid");
        if (sayzid) audioManager.playMemberSound(sayzid);
        highlightMemberInArena("sayzid", "Dada rui mach hobe rui mach?");

        // Fast hardcore spawn interval
        spawnTimer = setInterval(spawnTarget, 390);
        spawnTarget();

        windTimer = setInterval(cycleWindGust, 4200);

        // Combo decay loop
        decayTimer = setInterval(() => {
          if (!running) return;
          if (combo > 1) {
            comboDecay -= 4.5;
            if (comboDecay <= 0) {
              combo = Math.max(1, combo - 1);
              comboDecay = combo > 1 ? 65 : 0;
              comboEl.textContent = `x${combo}`;
            }
          }
          comboBar.style.width = `${Math.max(0, Math.min(100, comboDecay))}%`;
        }, 120);

        countdownTimer = setInterval(() => {
          timeLeft -= 1;
          timeEl.textContent = `${timeLeft}s`;
          if (timeLeft <= 0) {
            running = false;
            clearInterval(spawnTimer);
            clearInterval(countdownTimer);
            clearInterval(windTimer);
            clearInterval(decayTimer);
            windForceX = 0;
            arena.classList.remove("wind-gust-left", "wind-gust-right");
            arena.querySelectorAll(".flying-target").forEach((n) => n.remove());
            comboBar.style.width = "0%";
            windBanner.textContent = `RUSH OVER! FINAL SCORE: ${score}`;
            audioManager.playEventAlert("chaos");
          }
        }, 1000);
      });
    }

    /* ==========================================================================
       BANGLA DARK GAME 2: লাশের মালিক কে? (WHO OWNS THE CORPSE?)
       ========================================================================== */
    function initCorpseGame() {
      const cases = [

          clue: "ঘটনাস্থলে ধোঁয়ার গন্ধ আর ব্যারেলের গায়ে খড়ি দিয়ে লেখা: ‘Ganja khamu, barrel homu’।",

        {

          title: "কবরের ফলকে বিয়ের কাবিননামা ঝোলানো লাশ",

          joke: "সায়জিদ: ‘লাশটা একটু নড়ল মনে হয়—দাদা রুই মাছ হবে রুই মাছ?’"
        },
        {
          code: "CASE #07 // হাতির হোল রহস্য",
          title: "বিস্ময়ে চোখ কপালে ওঠা লাশ",
          clue: "দেহটা দেখে মনে হচ্ছে শেষ মুহূর্তে কেউ চিৎকার করেছিল: ‘kire! Hatir hol hoya gesu tui?’",

        },
        {
          code: "CASE #08 // অভিশপ্ত সম্ভাষণ",

          culpritId: "anam",
          joke: "আনাম: ‘eeeee vaiii—কবর থেকেও কচি মাল দেখে হাসি থামাতে পারলাম না!’"

      const clueEl = document.getElementById("corpse-clue-text");

      const streakEl = document.getElementById("corpse-streak");
      const verdictEl = document.getElementById("corpse-verdict");
      const gridEl = document.getElementById("corpse-suspect-grid");

      function loadCase(idx) {
        currentIdx = ((idx % cases.length) + cases.length) % cases.length;
        answered = false;
        const c = cases[currentIdx];
        codeEl.textContent = c.code;
        titleEl.textContent = c.title;
        clueEl.textContent = c.clue;
        verdictEl.textContent = "ক্লু পড়ে দেখো—কে এমন অদ্ভুত কাণ্ড ঘটিয়ে লাশ বা ঝামেলা বাঁধাতে পারে?";

        miniAv.style.height = "48px";
        miniAv.style.flexShrink = "0";

        const span = document.createElement("span");
        span.style.fontFamily = "var(--font-mono)";
        span.style.fontWeight = "700";
        span.textContent = m.name;

        btn.appendChild(miniAv);
        btn.appendChild(span);

        btn.addEventListener("click", () => {
          const c = cases[currentIdx];
          audioManager.playMemberSound(m);
          if (m.id === c.culpritId) {
            if (!answered) {
              score += 20;
              streak += 1;
              answered = true;
            }
            verdictEl.innerHTML = `<strong style="color:var(--amber-sulfur);">সঠিক ধরা পড়েছে! (${m.name})</strong> — ${c.joke}`;

            streak = 0;
            verdictEl.innerHTML = `<strong style="color:#f08080;">ভুল অনুমান!</strong> ${m.name} বলছে: “${m.dialogue}” — আসল কেস লুকিয়ে আছে অন্য কারও কীর্তিতে!`;
          }
          scoreEl.textContent = score;
          streakEl.textContent = streak;
        });

        gridEl.appendChild(btn);
      });

      document.getElementById("btn-next-corpse").addEventListener("click", () => {
        audioManager.playEventAlert("chaos");
        loadCase(currentIdx + 1);
      });

      loadCase(0);
    }

    /* ==========================================================================
       BANGLA DARK GAME 3: মৃত্যুর পর গ্রুপ চ্যাট (AFTERLIFE GROUP CHAT)
       ========================================================================== */
    function initAfterlifeChatGame() {
      const logEl = document.getElementById("afterlife-chat-log");
      const choicesEl = document.getElementById("afterlife-choices");
      const chaosEl = document.getElementById("afterlife-chaos");
      let chaos = 15;

      function appendChat(sender, text, isPlayer = false) {
        const msg = document.createElement("div");
        msg.className = `chat-msg ${isPlayer ? "player-msg" : ""}`;
        msg.innerHTML = `
          <div class="chat-msg-head">${sender} // কবরের ওপার থেকে</div>
          <div>${text}</div>
        `;
        logEl.appendChild(msg);
        logEl.scrollTop = logEl.scrollHeight;
      }

      const seedMessages = [
        { who: "Billal", text: "kire shuworer bacchara. কবরে এসেও শান্তি নাই?" },
        { who: "Sayzid", text: "Dada rui mach hobe rui mach? এখানের নদীতে কি ভূতুড়ে রুই আছে?" },

    /* ==========================================================================
       BAZAAR BEATBOX 8-STEP SEQUENCER (IN SOUND ROOM)
       ========================================================================== */
    function initBeatboxSequencer() {
      const grid = document.getElementById("seq-grid");
      const playBtn = document.getElementById("btn-seq-play");
      const randomBtn = document.getElementById("btn-seq-random");
      const clearBtn = document.getElementById("btn-seq-clear");

      const steps = 8;
      const pattern = COMMITTEE_CONFIG.members.map(() => Array(steps).fill(false));
      let isPlaying = false;
      let currentStep = 0;
      let timer = null;

      function renderGrid() {
        grid.innerHTML = "";
        COMMITTEE_CONFIG.members.forEach((member, rIdx) => {
          const row = document.createElement("div");
          row.className = "seq-row";

          const label = document.createElement("div");
          label.className = "seq-member-label";
          label.textContent = member.name;
          row.appendChild(label);

          for (let c = 0; c < steps; c++) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = `seq-step ${pattern[rIdx][c] ? "active" : ""}`;
            cell.dataset.col = c;
            cell.ariaLabel = `${member.name} step ${c + 1}`;
            cell.addEventListener("click", () => {
              pattern[rIdx][c] = !pattern[rIdx][c];
              cell.classList.toggle("active", pattern[rIdx][c]);
              if (pattern[rIdx][c]) {
                audioManager.playMemberSound(member, null, true);
              }
            });
            row.appendChild(cell);
          }
          grid.appendChild(row);
        });
      }

      function tickStep() {
        document.querySelectorAll(".seq-step.current-col").forEach((el) => el.classList.remove("current-col"));
        document.querySelectorAll(`.seq-step[data-col="${currentStep}"]`).forEach((el) => el.classList.add("current-col"));

        COMMITTEE_CONFIG.members.forEach((member, rIdx) => {
          if (pattern[rIdx][currentStep]) {
            audioManager.playMemberSound(member, null, true);
          }
        });

        currentStep = (currentStep + 1) % steps;
      }

      playBtn.addEventListener("click", () => {
        if (isPlaying) {
          isPlaying = false;
          clearInterval(timer);
          playBtn.textContent = "Play Loop";
          document.querySelectorAll(".seq-step.current-col").forEach((el) => el.classList.remove("current-col"));
        } else {
          isPlaying = true;
          playBtn.textContent = "Stop Loop";
          currentStep = 0;
          tickStep();
          timer = setInterval(tickStep, 340);
        }
      });

      randomBtn.addEventListener("click", () => {
        for (let r = 0; r < pattern.length; r++) {
          for (let c = 0; c < steps; c++) {
            pattern[r][c] = Math.random() > 0.78;
          }
        }
        renderGrid();
      });

      clearBtn.addEventListener("click", () => {
        for (let r = 0; r < pattern.length; r++) {
          pattern[r].fill(false);
        }
        renderGrid();
      });

      renderGrid();
    }

    function renderMemoryWall() {
      const filterBar = document.getElementById("memory-filters");

      const categories = ["ALL", ...new Set(COMMITTEE_CONFIG.memories.map((m) => m.category))];

      filterBar.innerHTML = "";

        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `filter-chip ${state.memoryCategory === cat ? "active" : ""}`;

        chip.addEventListener("click", () => {
          state.memoryCategory = cat;
          renderMemoryWall();

      });

      grid.innerHTML = "";
      const filtered = state.memoryCategory === "ALL"
        ? COMMITTEE_CONFIG.memories
        : COMMITTEE_CONFIG.memories.filter((m) => m.category === state.memoryCategory);

      filtered.forEach((item) => {
        const card = document.createElement("article");
        card.className = "memory-card";

        const mediaBox = document.createElement("div");
        mediaBox.className = "memory-media";

        if (item.mediaType === "image") {
          const img = document.createElement("img");

          img.alt = item.title;
          img.onerror = () => {
            mediaBox.innerHTML = `<div class="memory-placeholder-label">MISSING FILE: ${item.mediaPath}</div>`;
          };
          mediaBox.appendChild(img);
        } else if (item.mediaType === "video") {
          const vid = document.createElement("video");
          vid.src = item.mediaPath;
          vid.controls = true;
          mediaBox.appendChild(vid);
        } else {
          mediaBox.innerHTML = `<div class="memory-placeholder-label">PLACEHOLDER SLOT<br>${item.mediaPath}</div>`;
        }

        card.appendChild(mediaBox);
        card.insertAdjacentHTML("beforeend", `
          <div class="memory-meta">
            <span>${item.category}</span>
            <span>${item.date}</span>
          </div>
          <div class="memory-caption">${item.title}</div>
          <div class="memory-desc">${item.caption}</div>
        `);
        grid.appendChild(card);
      });
    }

    function renderAboutSection() {
      const container = document.getElementById("about-content");
      container.innerHTML = "";
      COMMITTEE_CONFIG.about.paragraphs.forEach((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        container.appendChild(p);
      });
      const note = document.createElement("div");
      note.className = "about-note";
      note.textContent = COMMITTEE_CONFIG.about.placeholderNotice;
      container.appendChild(note);
    }

    /* ==========================================================================
       CHARACTER PROFILE DOSSIER MODAL
       ========================================================================== */
    function openDossier(memberId) {
      const idx = COMMITTEE_CONFIG.members.findIndex((m) => m.id === memberId);
      const member = COMMITTEE_CONFIG.members[idx];
      if (!member) return;

      state.activeModalMember = member;

      document.getElementById("dossier-code").textContent = `FILE // 0${idx + 1}`;
      document.getElementById("dossier-name").textContent = member.name;
      document.getElementById("dossier-dialogue").textContent = `"${member.dialogue}"`;
      document.getElementById("dossier-nickname").textContent = member.nickname;
      document.getElementById("dossier-desc").textContent = member.description;
      document.getElementById("dossier-personality").textContent = member.personality;
      document.getElementById("dossier-ability").textContent = member.ability;

      const avatarSlot = document.getElementById("dossier-avatar-slot");
      avatarSlot.innerHTML = "";
      avatarSlot.appendChild(createAvatarVisual(member));

      const statsContainer = document.getElementById("dossier-stats");
      statsContainer.innerHTML = "";
      member.stats.forEach((st) => {
        const row = document.createElement("div");
        row.className = "stat-row";
        row.innerHTML = `
          <div class="stat-row-head">
            <span>${st.label}</span>
            <span>${st.value}%</span>
          </div>
          <div class="stat-track">
            <div class="stat-fill" style="width:${Math.max(0, Math.min(100, st.value))}%"></div>
          </div>
        `;
        statsContainer.appendChild(row);
      });

      const backdrop = document.getElementById("dossier-backdrop");
      backdrop.classList.add("open");
      document.getElementById("dossier-close-btn").focus();
    }

    function closeDossier() {
      document.getElementById("dossier-backdrop").classList.remove("open");
      state.activeModalMember = null;
    }

    /* ==========================================================================
       NAVIGATION & INITIALIZATION
       ========================================================================== */
    function initNavigation() {
      const tabs = document.querySelectorAll(".nav-tab");
      const sections = document.querySelectorAll(".view-section");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const targetId = tab.dataset.target;
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          sections.forEach((sec) => {
            sec.classList.toggle("active", sec.id === targetId);
          });
        });
      });

      // Sub-tabs inside Games & Chaos
      const gameBtns = document.querySelectorAll(".game-tab-btn");
      const gamePanels = document.querySelectorAll(".game-panel");
      gameBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetGame = btn.dataset.game;
          gameBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          gamePanels.forEach((p) => p.classList.toggle("active", p.id === targetGame));
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Entry Gate Controls
      const gate = document.getElementById("entry-gate");
      document.getElementById("enter-with-sound").addEventListener("click", () => {
        audioManager.unlock(true);
        gate.classList.add("hidden");
      });
      document.getElementById("enter-muted").addEventListener("click", () => {
        audioManager.unlock(false);
        gate.classList.add("hidden");
      });

      // Top Audio Controls
      document.getElementById("toggle-mute-btn").addEventListener("click", () => audioManager.toggleMute());
      document.getElementById("toggle-music-btn").addEventListener("click", () => audioManager.toggleMusic());
      document.getElementById("volume-control").addEventListener("input", (e) => audioManager.setVolume(e.target.value));

      // Chaos Controls
      document.getElementById("btn-unleash-chaos").addEventListener("click", triggerUnleashChaos);
      document.getElementById("btn-emergency").addEventListener("click", triggerEmergencyMeeting);
      document.getElementById("btn-random-member").addEventListener("click", triggerRandomMember);
      document.getElementById("btn-random-event").addEventListener("click", triggerRandomEvent);

      // Modal Controls
      document.getElementById("dossier-close-btn").addEventListener("click", closeDossier);
      document.getElementById("dossier-backdrop").addEventListener("click", (e) => {
        if (e.target.id === "dossier-backdrop") closeDossier();
      });
      document.getElementById("dossier-sound-btn").addEventListener("click", () => {
        if (state.activeModalMember) audioManager.playMemberSound(state.activeModalMember);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDossier();
      });

      // Render & Initialize Everything
      initNavigation();
      renderMainScene();
      initReactionStamps();
      renderMembersRoster();
      renderSoundRoom();
      initBeatboxSequencer();
      renderMemoryWall();
      renderAboutSection();
      initRuiMachGame();
      initCorpseGame();
      initAfterlifeChatGame();
      initHellJobGame();
      initEasterEggs();
      startBlinkingLoop();
      startAutonomousLife();
    });
  </script>
</body>
</html>
